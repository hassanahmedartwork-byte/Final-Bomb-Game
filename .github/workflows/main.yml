name: Build Party Box IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Party Box Project & Official AppIcon
        run: |
          mkdir -p PartyBox/Assets.xcassets/AppIcon.appiconset
          cp PartyBoxApp.swift PartyBox/PartyBoxApp.swift

          python3 - << 'PYEOF'
          import base64
          for line in open("PartyBox/PartyBoxApp.swift"):
              if "APP_ICON_B64:" in line:
                  b64 = line.split("APP_ICON_B64:")[1].strip()
                  open("icon_raw.jpg", "wb").write(base64.b64decode(b64))
                  break
          PYEOF

          sips -s format png -z 1024 1024 icon_raw.jpg --out PartyBox/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          sips -s format png -z 180 180 icon_raw.jpg --out PartyBox/Assets.xcassets/AppIcon.appiconset/Icon-180.png
          sips -s format png -z 120 120 icon_raw.jpg --out PartyBox/Assets.xcassets/AppIcon.appiconset/Icon-120.png

          cat << 'EOF' > PartyBox/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              { "filename" : "Icon-120.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "Icon-180.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "Icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          cat << 'EOF' > project.yml
          name: PartyBox
          options:
            bundleIdPrefix: com.partybox
            deploymentTarget:
              iOS: "15.0"
          targets:
            PartyBox:
              type: application
              platform: iOS
              sources:
                - PartyBox
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.partybox.gameshub
                  INFOPLIST_FILE: PartyBox/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          cat << 'EOF' > PartyBox/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>ar</string>
              <key>CFBundleDisplayName</key>
              <string>Party Box</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>PartyBox</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>UIPrerenderedIcon</key>
                      <true/>
                  </dict>
              </dict>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project PartyBox.xcodeproj \
            -target PartyBox \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into PartyBox.ipa
        run: |
          cp PartyBox/Assets.xcassets/AppIcon.appiconset/Icon-180.png build/Release-iphoneos/PartyBox.app/AppIcon60x60@3x.png
          cp PartyBox/Assets.xcassets/AppIcon.appiconset/Icon-120.png build/Release-iphoneos/PartyBox.app/AppIcon60x60@2x.png
          mkdir -p Payload
          cp -r build/Release-iphoneos/PartyBox.app Payload/
          zip -r PartyBox.ipa Payload

      - name: Upload PartyBox.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartyBox-iOS-IPA
          path: PartyBox.ipa
