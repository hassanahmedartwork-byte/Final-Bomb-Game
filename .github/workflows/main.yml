name: Build iPhone IPA With Icon

on:
  push:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare iOS Project & Extract Official AppIcon
        run: |
          mkdir -p TheBombGame/Assets.xcassets/AppIcon.appiconset
          if [ -f "ProBombGame3D.swift" ]; then
            cp ProBombGame3D.swift TheBombGame/TheBombGame.swift
          elif [ -f "FinalBombGame3D.swift" ]; then
            cp FinalBombGame3D.swift TheBombGame/TheBombGame.swift
          fi

          python3 - << 'PYEOF'
          import base64
          for line in open("TheBombGame/TheBombGame.swift"):
              if "APP_ICON_B64:" in line:
                  b64 = line.split("APP_ICON_B64:")[1].strip()
                  open("icon_raw.jpg", "wb").write(base64.b64decode(b64))
                  break
          PYEOF

          sips -s format png -z 1024 1024 icon_raw.jpg --out TheBombGame/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          sips -s format png -z 180 180 icon_raw.jpg --out TheBombGame/Assets.xcassets/AppIcon.appiconset/Icon-180.png
          sips -s format png -z 120 120 icon_raw.jpg --out TheBombGame/Assets.xcassets/AppIcon.appiconset/Icon-120.png

          cat << 'EOF' > TheBombGame/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "Icon-120.png",
                "idiom" : "iphone",
                "scale" : "2x",
                "size" : "60x60"
              },
              {
                "filename" : "Icon-180.png",
                "idiom" : "iphone",
                "scale" : "3x",
                "size" : "60x60"
              },
              {
                "filename" : "Icon-1024.png",
                "idiom" : "ios-marketing",
                "scale" : "1x",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cat << 'EOF' > project.yml
          name: TheBombGame
          options:
            bundleIdPrefix: com.neon3d
            deploymentTarget:
              iOS: "15.0"
          targets:
            TheBombGame:
              type: application
              platform: iOS
              sources:
                - TheBombGame
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.neon3d.thebombgame
                  INFOPLIST_FILE: TheBombGame/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  MARKETING_VERSION: "3.0.0"
                  CURRENT_PROJECT_VERSION: "3"
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          cat << 'EOF' > TheBombGame/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>ar</string>
              <key>CFBundleDisplayName</key>
              <string>لعبة القنبلة</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>TheBombGame</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>3.0.0</string>
              <key>CFBundleVersion</key>
              <string>3</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>UIPrerenderedIcon</key>
                      <true/>
                  </dict>
              </dict>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project TheBombGame.xcodeproj \
            -target TheBombGame \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa with Fallback Icons
        run: |
          cp TheBombGame/Assets.xcassets/AppIcon.appiconset/Icon-180.png build/Release-iphoneos/TheBombGame.app/AppIcon60x60@3x.png
          cp TheBombGame/Assets.xcassets/AppIcon.appiconset/Icon-120.png build/Release-iphoneos/TheBombGame.app/AppIcon60x60@2x.png
          mkdir -p Payload
          cp -r build/Release-iphoneos/TheBombGame.app Payload/
          zip -r TheBombGame.ipa Payload

      - name: Upload TheBombGame.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheBombGame-iOS-IPA
          path: TheBombGame.ipa
